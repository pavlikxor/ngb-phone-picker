name: Publish npm package

on:
  workflow_dispatch:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ./ngb-phone-picker

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm
          cache-dependency-path: ngb-phone-picker/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build Angular library
        run: npm run build

      - name: Publish package to npm
        working-directory: ./ngb-phone-picker/dist/ngb-phone-picker
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public
