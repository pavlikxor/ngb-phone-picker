<form>
  <mat-form-field class="phone-input-field">
    <mat-label>Phone</mat-label>

    <button
      aria-haspopup="listbox"
      type="button"
      class="country-list__dropdown-btn"
      matPrefix
      [matMenuTriggerFor]="menu"
      (menuOpened)="onMenuOpened()"
      (menuClosed)="onMenuClosed()"
      [class.empty]="!selectedCountry()">
      @let selectedCountryValue = selectedCountry(); @if (selectedCountryValue)
      {
      <span
        [class]="'country--flag flag:' + selectedCountryValue.prefix"></span>
      <span class="code-prefix">+{{ selectedCountryValue.countryCode }}</span>
      }@else {
      <span class="dropdown-label">Select Country</span>
      }
    </button>

    <mat-menu #menu="matMenu">
      <ng-template matMenuContent>
        <input
          #countrySearch
          type="text"
          placeholder="Search countries..."
          class="country-list__search-input"
          (click)="$event.stopPropagation()"
          [formField]="serchCountryForm.query" />
        <div class="country-list__container">
          @for (country of filteredCountries(); track $index) {
          <button
            type="button"
            mat-menu-item
            class="country-list__country-btn"
            (click)="countryCodeSelectClick(country)">
            <span [class]="'country--flag flag:' + country.prefix"></span>
            <span class="country--name">{{ country.countryName }}</span>
          </button>
          }
        </div>
      </ng-template>
    </mat-menu>

    <input
      type="text"
      #phoneInput
      matInput
      [formField]="phoneForm.phoneNumber" />

    @for(error of phoneForm.phoneNumber().errors(); track $index){
    <mat-error>{{ error.message }}</mat-error>
    }
  </mat-form-field>
</form>
