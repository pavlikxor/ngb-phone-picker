<div class="btn-group">
  <div
    class="btn-group"
    ngbDropdown
    role="group"
    aria-label="Button group with nested dropdown"
    (openChange)="dropdownChange($event)">
    <button
      type="button"
      class="btn int-phone-picker__dropdown-btn"
      [disabled]="disabled()"
      ngbDropdownToggle>
      @let selectedCountryValue = selectedCountry(); @if (selectedCountryValue)
      {
      <span
        [class]="'country--flag flag:' + selectedCountryValue.prefix"></span>
      <span class="country--prefix">
        +{{ selectedCountryValue.countryCode }}
      </span>
      } @else {
      <span class="dropdown-label">Select country</span>
      }
    </button>

    <div
      class="dropdown-menu int-phone-picker__container"
      ngbDropdownMenu>
      <input
        #countrySearch
        type="text"
        placeholder="Type country name or code..."
        class="form-control int-phone-picker__country-input"
        [formField]="searchCountryForm.query" />
      <div class="int-phone-picker__options-list">
        @for (country of filteredCountries(); track $index) {
        <button
          ngbDropdownItem
          class="country__option"
          (click)="countryOptionClick(country)">
          <span [class]="'country--flag flag:' + country.prefix"></span>
          <ngb-highlight
            class="country--prefix"
            [result]="'+' + country.countryCode"
            [term]="searchModel().query"></ngb-highlight>
          <ngb-highlight
            [result]="country.countryName"
            [term]="searchModel().query"></ngb-highlight>
        </button>
        }
      </div>
    </div>
  </div>
  <!-- Main Phone Input -->
  <input
    #phoneInput
    id="phoneInput"
    type="tel"
    class="form-control int-phone-picker__phone-input"
    placeholder="Phone number"
    [formField]="phoneForm.phoneNumber" />
</div>
@for(error of phoneForm.phoneNumber().errors(); track $index){
<div>{{ error.message }}</div>
}
