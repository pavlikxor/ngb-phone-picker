<div class="ngb-phone-picker__group">
  <div
    dropdownClass="ngb-phone-picker__dropdown"
    ngbDropdown
    aria-label="Dropdown with country code selection"
    (openChange)="dropdownChange($event)">
    <button
      type="button"
      class="btn ngb-phone-picker__dropdown-btn"
      [disabled]="disabled()"
      ngbDropdownToggle>
      @let selectedCountryValue = selectedCountry(); @if (selectedCountryValue)
      {
      <span
        [class]="'country--flag flag:' + selectedCountryValue.prefix"></span>
      <span class="country--prefix">
        +{{ selectedCountryValue.countryCode }}
      </span>
      } @else {
      <span class="dropdown-label">Select country</span>
      }
    </button>

    <div
      class="dropdown-menu ngb-phone-picker__container"
      ngbDropdownMenu>
      <input
        #countrySearchInput
        type="text"
        placeholder="Type country name or code..."
        class="form-control ngb-phone-picker__country-input"
        [formField]="searchCountryForm.query" />
      <div class="ngb-phone-picker__options-list">
        @for (country of filteredCountries(); track $index) {
        <button
          ngbDropdownItem
          class="country__option"
          (click)="countryOptionClick(country)">
          <span [class]="'country--flag flag:' + country.prefix"></span>
          <span class="country--prefix">
            @for (segment of country.prefixSegments; track $index) {
              @if (segment.isMatch) {
                <mark class="country--match">{{ segment.text }}</mark>
              } @else {
                <span>{{ segment.text }}</span>
              }
            }
          </span>
          <span class="country--name">
            @for (segment of country.nameSegments; track $index) {
              @if (segment.isMatch) {
                <mark class="country--match">{{ segment.text }}</mark>
              } @else {
                <span>{{ segment.text }}</span>
              }
            }
          </span>
        </button>
        }
      </div>
    </div>
  </div>
  <!-- Main Phone Input -->
  <input
    #phoneInput
    id="phoneInput"
    type="tel"
    class="form-control ngb-phone-picker__phone-input"
    placeholder="Phone number"
    [formField]="phoneForm.phoneNumber" />
</div>
@for(error of phoneForm.phoneNumber().errors(); track $index){
<div class="ngb-phone-picker__error">{{ error.message }}</div>
}
